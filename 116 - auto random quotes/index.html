<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Random Quote</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Random Quotes Generator</h1>
    <div class="quotes">
        <span class="quote-id">0</span>
        <div class="quote-display">Quote Will Appear Here</div>
        <div class="buttons">
            <button class="generate" type="button">Generate Quote</button>
            <button class="auto" type="button">Auto Generate</button>
            <button class="stop" type="button">Stop Generate</button>
            <button class="audio" type="button">Audio</button>
        </div>
    </div>
    <div class="auto-status"> Auto: OFF </div>

    <script src="./main.js"></script>
</body>

</html>
